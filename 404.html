<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="32x32">

<body>
  <header class="topbar">
    <h1><a href="/" class="home">Word Viewer</a></h1>

    <a href="/changelog" data-i18n="changelog">Changelog</a>

  <script src="/i18n.js"></script>
  <script src="/site.js"></script>
